<script>

/* ======================================================
   MÚSICA
   ====================================================== */

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const icon = document.getElementById('icon');

function togglePlay(){

  if(audio.paused) {

    audio.play();

    icon.innerHTML =
      '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  } else {

    audio.pause();

    icon.innerHTML =
      '<path d="M8 5v14l11-7z"/>';

  }

}


/* ======================================================
   CONTADOR
   ====================================================== */

const fechaEvento =
  new Date("2026-08-01T00:00:00");

function actualizarContador(){

  const dif =
    fechaEvento -
    new Date().getTime();

  if(dif > 0){

    document.getElementById("dias").textContent =
      Math.floor(
        dif /
        (1000*60*60*24)
      );

    document.getElementById("horas").textContent =
      Math.floor(
        (dif /
        (1000*60*60)) % 24
      )
      .toString()
      .padStart(2,"0");

    document.getElementById("minutos").textContent =
      Math.floor(
        (dif /
        (1000*60)) % 60
      )
      .toString()
      .padStart(2,"0");

    document.getElementById("segundos").textContent =
      Math.floor(
        (dif / 1000) % 60
      )
      .toString()
      .padStart(2,"0");

  } else {

    document.getElementById("dias").textContent = "000";
    document.getElementById("horas").textContent = "00";
    document.getElementById("minutos").textContent = "00";
    document.getElementById("segundos").textContent = "00";

  }

}

setInterval(actualizarContador, 1000);

actualizarContador();


/* ======================================================
   GALERÍA
   ====================================================== */

const images =
  document.querySelectorAll(
    '.slider-container img'
  );

let current = 0;

setInterval(() => {

  images[current]
    .classList
    .remove('active');

  current =
    (current + 1) %
    images.length;

  images[current]
    .classList
    .add('active');

}, 3000);


/* ======================================================
   API
   ====================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwCE6XxIHGi_IHbE6EZSi6v1iFXo2FEvY1ZNcsCyaRoVD2Cb-0LKbmLeLN6HK9l_3Wn/exec'


/* ======================================================
   LLAMAR API
   ====================================================== */

function llamarAPI(parametros){

  return new Promise((resolve,reject)=>{

    const callback =
      'cb_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random()*9999
      );


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams({

        ...parametros,

        callback:callback

      });


    const tiempo =
      setTimeout(()=>{

        limpiar();

        reject();

      },15000);


    window[callback] =
      function(data){

        clearTimeout(tiempo);

        limpiar();

        resolve(data);

      };


    function limpiar(){

      delete window[callback];

      if(script.parentNode){

        script.parentNode.removeChild(
          script
        );

      }

    }


    script.onerror =
      function(){

        clearTimeout(tiempo);

        limpiar();

        reject();

      };


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(
      script
    );

  });

}


/* ======================================================
   ENVIAR
   ====================================================== */

  const nombre1 =

  const nombre2 =

      .getElementById('nombre2')
      .value
      .trim();


  const nombre3 =
    document
      .getElementById('nombre3')
      .value
      .trim();


  const a1 =
    document.querySelector(
      'input[name="a1"]:checked'
    )?.value || '';


  const a2 =
    document.querySelector(
      'input[name="a2"]:checked'
    )?.value || '';


  const a3 =
    document.querySelector(
      'input[name="a3"]:checked'
    )?.value || '';


  const mensaje =
    document.getElementById(
      'mensaje'
    );


  const pases =
    document.getElementById(
      'pases'
    );


  const boton =
    document.getElementById(
      'boton'
    );


  /* ==================================================
     VALIDAR INVITADO 1
     ================================================== */

  if(!nombre1){

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Escribe el nombre del invitado 1.';

    return;

  }


  if(
    nombre1.split(/\s+/).length < 3
  ){

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Escribe el nombre completo del invitado 1.';

    return;

  }


  if(!a1){

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'Selecciona la asistencia del invitado 1.';

    return;

  }


  /* ==================================================
     VALIDAR INVITADO 2
     ================================================== */

  if(nombre2){

    if(
      nombre2.split(/\s+/).length < 3
    ){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        'Escribe el nombre completo del invitado 2.';

      return;

    }


    if(!a2){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        'Selecciona la asistencia del invitado 2.';

      return;

    }

  }


  /* ==================================================
     VALIDAR INVITADO 3
     ================================================== */

  if(nombre3){

    if(!nombre2){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        'Primero debes agregar al invitado 2.';

      return;

    }


    if(
      nombre3.split(/\s+/).length < 3
    ){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        'Escribe el nombre completo del invitado 3.';

      return;

    }


    if(!a3){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        'Selecciona la asistencia del invitado 3.';

      return;

    }

  }


  /* ==================================================
     ENVIANDO
     ================================================== */

  boton.disabled = true;

  boton.textContent =
    'Enviando...';


  try{


    const respuesta =
      await llamarAPI({

        accion:'confirmar',

        invitado1:nombre1,

        asistencia1:a1,

        invitado2:nombre2,

        asistencia2:a2,

        invitado3:nombre3,

        asistencia3:a3

      });


    if(!respuesta.ok){

      mensaje.className =
        'mensaje visible';

      mensaje.textContent =
        respuesta.mensaje;

      return;

    }


    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      respuesta.mensaje;


    /* ==================================================
       MOSTRAR PASES
       ================================================== */

    if(
      respuesta.listaPases &&
      respuesta.listaPases.length
    ){

      pases.className =
        'pases visible';

      pases.innerHTML = '';


      respuesta.listaPases.forEach(
        function(p,index){

          const idPase =
            'pase_' +
            index +
            '_' +
            Date.now();


          pases.innerHTML += `

            <div class="pase">

              <div
                class="contenido-pase"
                id="${idPase}"
              >

                <div class="pase-titulo">
                  Pase de entrada
                </div>

                <div class="pase-linea"></div>

                <div class="pase-nombre">
                  ${escapar(p.nombre)}
                </div>

                <div class="codigo">
                  ${escapar(p.codigo)}
                </div>

                <div class="codigo-texto">
                  Código de acceso
                </div>

              </div>


              <button
                type="button"
                class="boton-descargar"
                onclick="descargarPase(
                  '${idPase}',
                  this
                )"
              >
                Descargar pase
              </button>

            </div>

          `;

        }
      );

    }

  }


  catch(error){

    console.error(error);

    mensaje.className =
      'mensaje visible';

    mensaje.textContent =
      'No se pudo conectar con el sistema.';

  }


  finally{

    boton.disabled = false;

    boton.textContent =
      'Enviar confirmación';

  }

}


/* ======================================================
   DESCARGAR PASE
   ====================================================== */

async function descargarPase(
  idPase,
  boton
){

  const contenido =
    document.getElementById(
      idPase
    );


  if(!contenido){

    return;

  }


  boton.disabled = true;

  boton.textContent =
    'Preparando pase...';


  try{


    /* ==================================================
       CARGAR HTML2CANVAS
       ================================================== */

    if(!window.html2canvas){

      await new Promise(
        (resolve,reject)=>{

          const script =
            document.createElement(
              'script'
            );


          script.src =
            'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';


          script.onload =
            resolve;


          script.onerror =
            reject;


          document.head.appendChild(
            script
          );

        }
      );

    }


    /* ==================================================
       GENERAR IMAGEN
       ================================================== */

    const canvas =
      await html2canvas(
        contenido,
        {

          scale:3,

          backgroundColor:
            '#ffffff',

          useCORS:true,

          logging:false,

          imageTimeout:15000,

          allowTaint:false

        }
      );


    /* ==================================================
       OBTENER NOMBRE
       ================================================== */

    const nombre =
      contenido
        .querySelector(
          '.pase-nombre'
        )
        .textContent
        .trim();


    const nombreArchivo =
      nombre

        .replace(
          /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,
          ''
        )

        .replace(
          /\s+/g,
          '-'
        )

        .substring(
          0,
          50
        )

        ||

        'Invitado';


    /* ==================================================
       DESCARGAR PNG
       ================================================== */

    canvas.toBlob(
      function(blob){

        if(!blob){

          throw new Error(
            'No se pudo generar la imagen.'
          );

        }


        const url =
          URL.createObjectURL(
            blob
          );


        const enlace =
          document.createElement(
            'a'
          );


        enlace.href =
          url;


        enlace.download =
          'Pase-' +
          nombreArchivo +
          '.png';


        document.body.appendChild(
          enlace
        );


        enlace.click();


        document.body.removeChild(
          enlace
        );


        setTimeout(
          function(){

            URL.revokeObjectURL(
              url
            );

          },
          1000
        );


      },
      'image/png'
    );


  }


  catch(error){

    console.error(error);

    alert(
      'No se pudo descargar el pase. Intenta nuevamente.'
    );

  }


  finally{

    boton.disabled = false;

    boton.textContent =
      'Descargar pase';

  }

}


/* ======================================================
   ESCAPAR
   ====================================================== */

function escapar(texto){

  return String(texto)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /\</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
